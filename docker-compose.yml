# Production Docker Compose - DevOps Shop
# React (Nginx) + Node.js/Express + MongoDB
#
# Biến môi trường được nội suy từ file .env nằm cạnh file này.
# Docker Compose tự động đọc .env trong thư mục chứa file compose khi chạy
# `docker compose -f <file>`, nên không cần export biến ra shell (quan trọng khi
# chạy qua `sudo`, vì sudo xóa sạch environment).
#
#   NODE_ENV, JWT_SECRET, CORS_ORIGIN, SEED_ON_START, ADMIN_INITIAL_PASSWORD
#   IMAGE_TAG, FRONTEND_IMAGE, BACKEND_IMAGE
#
# `name:` được cố định để tên project (và tên volume MongoDB) không đổi giữa
# các lần deploy -> dữ liệu database được giữ nguyên.

name: devops-shop

services:
  # Frontend - React build + Nginx phục vụ static files
  frontend:
    image: ${FRONTEND_IMAGE:-qlinh48/devops-shop-frontend}:${IMAGE_TAG:-latest}
    container_name: devshop-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - devshop-network
    depends_on:
      backend:
        condition: service_healthy

  # Backend - Node.js + Express + MongoDB
  backend:
    image: ${BACKEND_IMAGE:-qlinh48/devops-shop-backend}:${IMAGE_TAG:-latest}
    container_name: devshop-backend
    # env_file: truyền nguyên văn giá trị vào container (không qua nội suy
    # ${VAR}) nên ký tự đặc biệt trong secret không bị biến đổi.
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/devops-shop
    restart: unless-stopped
    networks:
      - devshop-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database - MongoDB (volume named để giữ dữ liệu)
  mongo:
    image: mongo:7
    container_name: devshop-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - devshop-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  devshop-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
